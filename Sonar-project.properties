# Konfigurasi SonarQube Delcom. Sesuaikan projectKey/projectName dengan kriteria
# "SonarQube Grading" bila berbeda (default: nama repository GitHub).
sonar.projectKey=ifs24018-pabwe2026-proyek1
sonar.projectName=ifs24018-pabwe2026-proyek1

sonar.sources=back-end/src,back-end/database,front-end/src
sonar.tests=back-end/tests,front-end/src
sonar.test.inclusions=back-end/tests/**,**/*.test.js,**/*.test.jsx

sonar.sourceEncoding=UTF-8

# Dibuat oleh tahap Test di Jenkinsfile (path lcov diubah menjadi relatif terhadap root).
sonar.javascript.lcov.reportPaths=coverage/back-end.lcov,coverage/front-end.lcov

sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,front-end/src/main.jsx,front-end/src/setupTests.js,front-end/src/test-utils.jsx,**/*.test.js,**/*.test.jsx
sonar.coverage.exclusions=back-end/database/migrations/**,back-end/database/migrate.js,back-end/src/server.js
