# Render Blueprint GRATIS untuk demo.
# Catatan: /tmp dapat ditulis, tetapi bersifat sementara. Data SQLite dapat hilang
# saat service restart/redeploy atau instance diganti. Untuk data persisten, lihat
# render-persistent.yaml (membutuhkan Persistent Disk berbayar di Render).
services:
  - type: web
    name: ifs24018-study-planner
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_FILE
        value: /tmp/planner.db
      - key: CLIENT_DIST
        value: /app/client/dist
      - key: SEED_DEMO
        value: "false"
